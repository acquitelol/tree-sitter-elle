[package]
name = "tree-sitter-elle"
description = "Elle grammar for tree-sitter"
version = "0.1.0"
authors = ["Tnixc <tnixxc@gmail.com>", "Rosie <acquitefx@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "elle"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/acquitelol/tree-sitter-elle"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
    "bindings/rust/*",
    "grammar.js",
    "queries/*",
    "src/*",
    "tree-sitter.json",
    "LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.3"
